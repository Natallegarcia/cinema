spring.application.name=ingressos-cinema

# ======== Banco de dados relacional (H2) ========
# Banco em arquivo (./data/cinemadb.mv.db). AUTO_SERVER=TRUE permite conectar pelo DBeaver
# enquanto a aplicacao esta rodando.
spring.datasource.url=jdbc:h2:file:./data/cinemadb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Console web do H2 disponivel em /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ======== Servidor ========
server.port=8080

# ======== Thymeleaf ========
spring.thymeleaf.cache=false
