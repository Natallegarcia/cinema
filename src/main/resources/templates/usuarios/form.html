<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuario - Cinema FATESG')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <h1 th:text="${usuario.id == null} ? 'Novo Usuario' : 'Editar Usuario'">Usuario</h1>
    <form class="card" th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="form-group">
            <label>Nome</label>
            <input type="text" th:field="*{nome}"/>
            <div class="error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>
        <div class="form-group">
            <label>Usuario (login)</label>
            <input type="text" th:field="*{username}"/>
            <div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>
        <div class="form-group">
            <label>E-mail</label>
            <input type="email" th:field="*{email}"/>
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="form-group">
            <label th:text="${usuario.id == null} ? 'Senha' : 'Senha (deixe em branco para manter)'">Senha</label>
            <input type="password" th:field="*{senha}"/>
            <div class="error" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
        </div>
        <div class="form-group">
            <label>Perfil</label>
            <select th:field="*{perfil}">
                <option th:each="p : ${T(com.fatesg.cinema.model.Usuario.Perfil).values()}"
                        th:value="${p}" th:text="${p}">PERFIL</option>
            </select>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
