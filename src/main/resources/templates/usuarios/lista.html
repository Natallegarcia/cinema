<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios - Cinema FATESG')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div class="topbar-title">
        <h1>Usuarios</h1>
        <a th:href="@{/usuarios/novo}" class="btn btn-primary">+ Novo Usuario</a>
    </div>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Usuario (login)</th>
            <th>E-mail</th>
            <th>Perfil</th>
            <th>Acoes</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}">1</td>
            <td th:text="${u.nome}">Nome</td>
            <td th:text="${u.username}">login</td>
            <td th:text="${u.email}">email</td>
            <td th:text="${u.perfil}">USER</td>
            <td class="actions">
                <a th:href="@{'/usuarios/' + ${u.id} + '/editar'}" class="btn btn-edit">Editar</a>
                <a th:href="@{'/usuarios/' + ${u.id} + '/excluir'}" class="btn btn-danger"
                   onclick="return confirm('Excluir este usuario?')">Excluir</a>
            </td>
        </tr>
        <tr th:if="${usuarios.isEmpty()}">
            <td colspan="6" style="text-align:center;color:#6b7280">Nenhum usuario cadastrado.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
