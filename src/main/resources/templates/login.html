<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login - Cinema FATESG')}"></head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <h1 style="color:#e50914;text-align:center">CINEMA FATESG</h1>
        <p style="text-align:center;color:#9aa3b2;margin-top:-8px;margin-bottom:22px">
            Sistema de Venda de Ingressos
        </p>

        <div th:if="${param.error}" class="alert alert-error">
            Usuario ou senha invalidos.
        </div>
        <div th:if="${param.logout}" class="alert alert-ok">
            Sessao encerrada com sucesso.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" autofocus required/>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required/>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Entrar</button>
        </form>
        <p style="color:#6b7280;font-size:12px;margin-top:18px;text-align:center">
            admin / admin123 (administrador) &nbsp;•&nbsp; user / user123 (cliente)
        </p>
    </div>
</div>
</body>
</html>
