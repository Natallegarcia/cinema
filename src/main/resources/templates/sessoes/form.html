<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sessao - Cinema FATESG')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <h1 th:text="${sessao.id == null} ? 'Nova Sessao' : 'Editar Sessao'">Sessao</h1>
    <form class="card" th:action="@{/sessoes/salvar}" th:object="${sessao}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="form-group">
            <label>Filme</label>
            <select th:field="*{filme}">
                <option value="" disabled>Selecione um filme</option>
                <option th:each="f : ${filmes}" th:value="${f.id}" th:text="${f.titulo}">Filme</option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('filme')}" th:errors="*{filme}"></div>
        </div>
        <div class="form-group">
            <label>Sala</label>
            <select th:field="*{sala}">
                <option value="" disabled>Selecione uma sala</option>
                <option th:each="s : ${salas}" th:value="${s.id}"
                        th:text="${s.nome} + ' (' + ${s.capacidade} + ' lugares, ' + ${s.tipo} + ')'">Sala</option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('sala')}" th:errors="*{sala}"></div>
        </div>
        <div class="form-group">
            <label>Data/Hora</label>
            <input type="datetime-local" th:field="*{dataHora}"/>
            <div class="error" th:if="${#fields.hasErrors('dataHora')}" th:errors="*{dataHora}"></div>
        </div>
        <div class="form-group">
            <label>Preco (R$)</label>
            <input type="number" step="0.01" th:field="*{preco}"/>
            <div class="error" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}"></div>
        </div>
        <div class="form-group">
            <label>Assentos Disponiveis</label>
            <input type="number" th:field="*{assentosDisponiveis}"/>
            <div class="error" th:if="${#fields.hasErrors('assentosDisponiveis')}" th:errors="*{assentosDisponiveis}"></div>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a th:href="@{/sessoes}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
